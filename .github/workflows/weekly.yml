name: Weekly collection

on:
  schedule:
    - cron: "23 7 * * 2"   # Tuesdays 07:23 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["config/**", "scripts/**", "docs/index.html", ".github/workflows/**"]

concurrency:
  group: build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Demo data (deterministic, regenerated from the script)
        run: python scripts/make_demo.py
      - name: Fetch from Apify and OpenAI (each source skipped without its secret)
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          TASK_AI_GEMINI: ${{ secrets.TASK_AI_GEMINI }}
          TASK_GOOGLE: ${{ secrets.TASK_GOOGLE }}
          TASK_REDDIT: ${{ secrets.TASK_REDDIT }}
          TASK_X: ${{ secrets.TASK_X }}
          TASK_LINKEDIN: ${{ secrets.TASK_LINKEDIN }}
          TASK_PAINS_REDDIT: ${{ secrets.TASK_PAINS_REDDIT }}
          TASK_PAINS_X: ${{ secrets.TASK_PAINS_X }}
          TASK_AI_AIO: ${{ secrets.TASK_AI_AIO }}
        run: python scripts/fetch.py
      - name: Build dashboard data
        run: python scripts/build.py
      - name: Send this week's actions to Jira (skipped without Jira secrets)
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}
        run: python scripts/to_jira.py
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add docs/data.json data/demo $(ls -d data/raw 2>/dev/null)
          git diff --cached --quiet || git commit -m "Weekly collection $(date -u +%F)"
          git push
